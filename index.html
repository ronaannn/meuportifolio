<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Direção de Fotografia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .font-elegant { font-family: 'Cinzel', serif; }

        .roulette-item {
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0.15;
            padding-top: 1rem;
            padding-bottom: 1rem;
            transform-origin: left center;
        }
        .roulette-item.active {
            opacity: 1;
        }
        .roulette-item:hover:not(.active) {
            opacity: 0.5;
            cursor: pointer;
        }

        .sub-projects {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            opacity: 0;
            margin-top: 0;
        }
        .roulette-item.active .sub-projects {
            max-height: 500px; 
            opacity: 1;
            margin-top: 0.5rem;
        }
        .sub-project-item {
            font-family: 'Inter', sans-serif;
            font-size: 1.25rem;
            font-weight: 300;
            text-transform: lowercase;
            letter-spacing: 0.1em;
            padding: 0.3rem 0;
            color: #888;
            transition: color 0.3s ease, padding-left 0.3s ease;
            cursor: pointer;
        }
        .sub-project-item.active-sub {
            color: #fff;
            padding-left: 1rem; 
        }
        .sub-project-item:hover:not(.active-sub) {
            color: #ccc;
        }

        #roulette-list {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            position: absolute;
            top: 0;
            left: 20px;
            width: 100%;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .bg-layer {
            transition: opacity 1.5s ease-in-out;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0.1) 100%);
            z-index: 10;
        }
    </style>
</head>
<body class="relative antialiased selection:bg-white selection:text-black">

    <div id="bg-container" class="absolute inset-0 z-0">
        <!-- Camadas de Imagem para crossfade -->
        <img id="bg-img-1" class="bg-layer opacity-100" src="" alt="Background 1">
        <img id="bg-img-2" class="bg-layer opacity-0" src="" alt="Background 2">
        
        <!-- Camada de Vídeo Local (Pronta para uso futuro) -->
        <video id="bg-video" class="bg-layer opacity-0 object-cover w-full h-full absolute inset-0 z-0 transition-opacity duration-1000" autoplay loop muted playsinline></video>

        <div class="overlay"></div>
    </div>

    <div class="relative z-20 w-full h-full flex flex-col pointer-events-none">
        <header class="p-8 md:p-12 absolute top-0 left-0 w-full flex justify-between items-center z-30 pointer-events-auto">
            <div class="text-xs tracking-[0.3em] uppercase font-light">Studio <br> <span class="font-bold">Aura</span></div>
            <div class="text-xs tracking-widest uppercase font-light">Selected Works</div>
        </header>

        <main class="flex-1 relative w-full md:w-2/3 pl-8 md:pl-16 h-full">
            <ul id="roulette-list" class="pointer-events-auto">
                <!-- Injetado via JS -->
            </ul>
        </main>

        <div class="absolute bottom-8 right-12 z-30 pointer-events-auto text-right">
            <div id="project-counter" class="text-sm font-light tracking-widest mb-1">01 / 05</div>
            <div id="project-name-display" class="text-xs text-gray-400 tracking-[0.2em] uppercase">LIBERVITA</div>
        </div>
    </div>

    <script>
        const portfolioData = [
            {
                categoryTitle: "FASHION FILM",
                projects: [
                    { 
                        name: "libervita", 
                        images: [
                            "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2070&auto=format&fit=crop",
                            "https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1976&auto=format&fit=crop"
                        ] 
                    },
                    { 
                        name: "micélio", 
                        images: [
                            "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1920&auto=format&fit=crop",
                            "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop"
                        ] 
                    }
                ]
            },
            {
                categoryTitle: "VIDEOCLIPE",
                projects: [
                    { 
                        name: "stand-it", 
                        images: [
                            "https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=2070&auto=format&fit=crop",
                            "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=2070&auto=format&fit=crop"
                        ] 
                    }
                ]
            },
            {
                categoryTitle: "CURTA-METRAGEM",
                projects: [
                    { 
                        name: "sonhos", 
                        // IMAGEM LOCAL ADICIONADA AQUI:
                        images: ["1_2.1.1.png"] 
                    }
                ]
            },
            {
                categoryTitle: "SHOW",
                projects: [
                    { name: "kyan", images: ["https://images.unsplash.com/photo-1540039155733-d76e6f48ce65?q=80&w=2070&auto=format&fit=crop"] },
                    { name: "kayblack", images: ["https://images.unsplash.com/photo-1470229722913-7c092b321a1b?q=80&w=2070&auto=format&fit=crop"] },
                    { name: "sá e guarabyra", images: ["https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1974&auto=format&fit=crop"] },
                    { name: "yunk vino", images: ["https://images.unsplash.com/photo-1520166012956-add9ba0ee3f4?q=80&w=2070&auto=format&fit=crop"] },
                    { name: "danzo", images: ["https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=2070&auto=format&fit=crop"] }
                ]
            },
            {
                categoryTitle: "DOCUMENTÁRIO",
                projects: [
                    { 
                        name: "pertencer", 
                        images: [
                            "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=2070&auto=format&fit=crop",
                            "https://images.unsplash.com/photo-1604085572504-a392ddf0d86a?q=80&w=2070&auto=format&fit=crop"
                        ] 
                    }
                ]
            }
        ];

        let currentCatIndex = 0;
        let currentProjIndex = 0;
        let currentImageIndex = 0;
        let activeBgLayer = 1;
        let slideInterval;
        let isAnimatingScroll = false;

        const listEl = document.getElementById('roulette-list');
        const bgImg1 = document.getElementById('bg-img-1');
        const bgImg2 = document.getElementById('bg-img-2');
        const bgVideo = document.getElementById('bg-video');
        const counterEl = document.getElementById('project-counter');
        const nameDisplayEl = document.getElementById('project-name-display');

        function initList() {
            portfolioData.forEach((cat, cIndex) => {
                const liCat = document.createElement('li');
                liCat.className = 'roulette-item pl-8 md:pl-16';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'font-elegant text-4xl md:text-5xl lg:text-6xl tracking-widest uppercase whitespace-nowrap';
                titleDiv.textContent = cat.categoryTitle;
                titleDiv.onclick = () => selectCategory(cIndex);
                
                const ulSub = document.createElement('ul');
                ulSub.className = 'sub-projects list-none pl-4';
                
                cat.projects.forEach((proj, pIndex) => {
                    const liSub = document.createElement('li');
                    liSub.className = 'sub-project-item';
                    liSub.textContent = proj.name;
                    liSub.onclick = (e) => {
                        e.stopPropagation(); 
                        selectProject(cIndex, pIndex);
                    };
                    ulSub.appendChild(liSub);
                });

                liCat.appendChild(titleDiv);
                liCat.appendChild(ulSub);
                listEl.appendChild(liCat);
            });
        }

        function updateRoulettePosition() {
            const items = listEl.children;
            if (!items.length) return;

            const viewportCenter = window.innerHeight / 2;
            let activeItemOffset = 0;

            Array.from(items).forEach((item, idx) => {
                const subItems = item.querySelectorAll('.sub-project-item');
                if (idx === currentCatIndex) {
                    item.classList.add('active');
                    activeItemOffset = item.offsetTop + (item.offsetHeight / 2);
                    subItems.forEach((sub, sIdx) => {
                        if (sIdx === currentProjIndex) sub.classList.add('active-sub');
                        else sub.classList.remove('active-sub');
                    });
                } else {
                    item.classList.remove('active');
                    subItems.forEach(sub => sub.classList.remove('active-sub'));
                }
            });

            const translateY = viewportCenter - activeItemOffset;

            Array.from(items).forEach((item, idx) => {
                const scale = idx === currentCatIndex ? 1 : 0.85;
                item.style.transform = `scale(${scale})`;
            });

            listEl.style.transform = `translateY(${translateY}px)`;

            const currentCat = portfolioData[currentCatIndex];
            const currentProj = currentCat.projects[currentProjIndex];
            counterEl.textContent = `0${currentProjIndex + 1} / 0${currentCat.projects.length}`;
            nameDisplayEl.textContent = currentProj.name;
        }

        // --- SISTEMA DE MÍDIA NATIVA (FOTOS E VÍDEOS LOCAIS) ---
        function playMedia() {
            const proj = portfolioData[currentCatIndex].projects[currentProjIndex];
            
            if (proj.videoLocal) {
                clearInterval(slideInterval);
                if (!bgVideo.src.endsWith(proj.videoLocal)) {
                    bgVideo.src = proj.videoLocal;
                }
                bgVideo.classList.remove('opacity-0');
                bgVideo.classList.add('opacity-100');
            } else {
                bgVideo.classList.remove('opacity-100');
                bgVideo.classList.add('opacity-0');
                setTimeout(() => { 
                    if (bgVideo.classList.contains('opacity-0')) bgVideo.src = ""; 
                }, 1000);
                
                changeImage(proj.images[0]);
                startSlideshow();
            }
        }

        function changeImage(url) {
            if (activeBgLayer === 1) {
                bgImg2.src = url;
                bgImg2.onload = () => {
                    bgImg2.classList.remove('opacity-0');
                    bgImg2.classList.add('opacity-100');
                    bgImg1.classList.remove('opacity-100');
                    bgImg1.classList.add('opacity-0');
                    activeBgLayer = 2;
                };
            } else {
                bgImg1.src = url;
                bgImg1.onload = () => {
                    bgImg1.classList.remove('opacity-0');
                    bgImg1.classList.add('opacity-100');
                    bgImg2.classList.remove('opacity-100');
                    bgImg2.classList.add('opacity-0');
                    activeBgLayer = 1;
                };
            }
        }

        function startSlideshow() {
            clearInterval(slideInterval);
            const proj = portfolioData[currentCatIndex].projects[currentProjIndex];
            if (!proj.videoLocal && proj.images.length > 1) {
                slideInterval = setInterval(() => {
                    currentImageIndex = (currentImageIndex + 1) % proj.images.length;
                    changeImage(proj.images[currentImageIndex]);
                }, 4000);
            }
        }

        function selectCategory(cIndex) {
            if (cIndex === currentCatIndex) return; 
            currentCatIndex = cIndex;
            currentProjIndex = 0; 
            currentImageIndex = 0;
            
            setTimeout(() => {
                updateRoulettePosition();
                playMedia();
            }, 50);
        }

        function selectProject(cIndex, pIndex) {
            currentCatIndex = cIndex;
            currentProjIndex = pIndex;
            currentImageIndex = 0;
            
            updateRoulettePosition();
            playMedia();
        }

        function handleNavigation(direction) {
            if (isAnimatingScroll) return;
            if (direction === 'down' && currentCatIndex < portfolioData.length - 1) {
                isAnimatingScroll = true;
                selectCategory(currentCatIndex + 1);
            } else if (direction === 'up' && currentCatIndex > 0) {
                isAnimatingScroll = true;
                selectCategory(currentCatIndex - 1);
            }
            setTimeout(() => { isAnimatingScroll = false; }, 800);
        }

        window.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) < 30) return; 
            handleNavigation(e.deltaY > 0 ? 'down' : 'up');
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') handleNavigation('down');
            if (e.key === 'ArrowUp') handleNavigation('up');
        });

        window.addEventListener('load', () => {
            initList();
            bgImg1.src = portfolioData[0].projects[0].images[0]; 
            
            setTimeout(() => {
                updateRoulettePosition();
                playMedia();
            }, 100);
        });

        window.addEventListener('resize', updateRoulettePosition);
    </script>
</body>
</html>
